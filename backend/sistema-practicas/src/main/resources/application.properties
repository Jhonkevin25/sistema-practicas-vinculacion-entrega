# Configuracion local opcional (NO se versiona): .env.properties junto al build.gradle
spring.config.import=optional:file:./.env.properties

# Base de datos (variables de entorno o .env.properties)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# El pooler de Supabase en modo sesion admite max 15 clientes; el default de
# Hikari (10) agota el cupo cuando conviven la app y los tests
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# SMTP: puerto 587 requiere STARTTLS explicito (Gmail lo exige; Brevo y otros
# proveedores por 587 tambien lo aceptan sin problema)
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Puerto del servidor
server.port=8080

# Nombre de la aplicación
spring.application.name=sistema-practicas

# JWT
app.jwt.secret=${APP_JWT_SECRET}

# Proteccion del inicio de sesion
app.auth.login-max-attempts=${APP_AUTH_LOGIN_MAX_ATTEMPTS:5}
app.auth.login-block-minutes=${APP_AUTH_LOGIN_BLOCK_MINUTES:15}
app.auth.login-rate-max-requests=${APP_AUTH_LOGIN_RATE_MAX_REQUESTS:30}
app.auth.login-rate-window-seconds=${APP_AUTH_LOGIN_RATE_WINDOW_SECONDS:60}
app.auth.trust-forwarded-for=${APP_AUTH_TRUST_FORWARDED_FOR:false}

# CORS: lista separada por comas (localhost + URL de ngrok)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Actuator: solo el health check queda expuesto (publico en SecurityConfig);
# sin detalles para anonimos (solo status UP/DOWN)
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
