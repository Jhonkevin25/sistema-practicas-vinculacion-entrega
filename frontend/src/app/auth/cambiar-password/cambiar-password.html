<div class="min-h-screen bg-unibe-bg flex flex-col justify-center items-center font-sans">
  <div class="w-full max-w-md bg-white border border-slate-200 rounded-2xl shadow-xl overflow-hidden">
    <div class="bg-unibe-blue p-8 text-center text-white relative">
      <div class="absolute inset-x-0 bottom-0 h-1 bg-unibe-gold"></div>
      <img src="/image/logo_unibe.png" alt="Universidad Iberoamericana del Ecuador" class="h-14 w-auto max-w-full object-contain mx-auto mb-5 brightness-0 invert" />
      <h1 class="text-2xl font-bold tracking-wide">Cambio de contraseña</h1>
      <p class="text-xs text-white/70 font-medium mt-1">Actualiza tu acceso institucional</p>
    </div>

    <div class="p-8">
      @if (errorMessage()) {
        <div class="mb-6 p-4 bg-red-50 border border-red-200 text-red-700 text-xs rounded-xl">
          {{ errorMessage() }}
        </div>
      }

      <form (ngSubmit)="onSubmit()" class="space-y-5">
        <div>
          <label for="actual" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Contraseña actual</label>
          <input id="actual" name="actual" type="password" [(ngModel)]="passwordActual" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 focus:border-unibe-blue focus:ring-1 focus:ring-unibe-blue text-sm text-slate-800 rounded-xl outline-none transition-all" />
        </div>

        <div>
          <label for="nueva" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Nueva contraseña</label>
          <input id="nueva" name="nueva" type="password" [(ngModel)]="nuevaPassword" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 focus:border-unibe-blue focus:ring-1 focus:ring-unibe-blue text-sm text-slate-800 rounded-xl outline-none transition-all" />
        </div>

        <div>
          <label for="confirmar" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Confirmar contraseña</label>
          <input id="confirmar" name="confirmar" type="password" [(ngModel)]="confirmarPassword" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 focus:border-unibe-blue focus:ring-1 focus:ring-unibe-blue text-sm text-slate-800 rounded-xl outline-none transition-all" />
        </div>

        <button type="submit" [disabled]="loading()" class="w-full py-3 px-4 bg-unibe-blue hover:bg-unibe-blue-hover text-white text-sm font-semibold rounded-xl transition-all shadow-md active:scale-[0.98] disabled:opacity-50 disabled:pointer-events-none">
          {{ loading() ? 'Actualizando...' : 'Actualizar contraseña' }}
        </button>
      </form>
      <p class="mt-6 text-center text-[10px] text-slate-400">Universidad Iberoamericana del Ecuador</p>
    </div>
  </div>
</div>
