<div class="min-h-screen bg-unibe-bg flex flex-col justify-center items-center font-sans">
  <div class="w-full max-w-md bg-white border border-slate-200 rounded-2xl shadow-xl overflow-hidden">
    <div class="bg-unibe-blue p-8 text-center text-white relative">
      <div class="absolute inset-x-0 bottom-0 h-1 bg-unibe-gold"></div>
      <img src="/image/logo_unibe.png" alt="Universidad Iberoamericana del Ecuador" class="h-14 w-auto max-w-full object-contain mx-auto mb-5 brightness-0 invert" />
      <h1 class="text-2xl font-bold tracking-wide">Recuperar contraseña</h1>
      <p class="text-xs text-white/70 font-medium mt-1">Plataforma institucional PRAVI</p>
    </div>

    <div class="p-8">
      @if (message()) {
        <div class="mb-6 p-4 bg-emerald-50 border border-emerald-200 text-emerald-700 text-xs rounded-xl">
          {{ message() }}
        </div>
      }
      @if (errorMessage()) {
        <div class="mb-6 p-4 bg-red-50 border border-red-200 text-red-700 text-xs rounded-xl">
          {{ errorMessage() }}
        </div>
      }

      <form (ngSubmit)="onSubmit()" class="space-y-5">
        <div>
          <label for="email" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">Correo institucional</label>
          <input id="email" name="email" type="email" [(ngModel)]="email" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 focus:border-unibe-blue focus:ring-1 focus:ring-unibe-blue text-sm text-slate-800 rounded-xl outline-none transition-all" placeholder="ejemplo@unibe.edu.ec" />
        </div>

        <button type="submit" [disabled]="loading()" class="w-full py-3 px-4 bg-unibe-blue hover:bg-unibe-blue-hover text-white text-sm font-semibold rounded-xl transition-all shadow-md active:scale-[0.98] disabled:opacity-50 disabled:pointer-events-none">
          {{ loading() ? 'Enviando...' : 'Enviar instrucciones' }}
        </button>
      </form>

      <div class="mt-5 text-center">
        <a routerLink="/login" class="text-xs font-semibold text-unibe-blue hover:text-unibe-blue-hover">Volver al inicio de sesión</a>
      </div>
      <p class="mt-6 text-center text-[10px] text-slate-400">Universidad Iberoamericana del Ecuador</p>
    </div>
  </div>
</div>
